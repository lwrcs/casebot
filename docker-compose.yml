services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casebot
      POSTGRES_USER: casebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebot"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    command: python main.py
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://casebot:${POSTGRES_PASSWORD}@db:5432/casebot

  web:
    build: .
    restart: unless-stopped
    command: uvicorn web.app:app --host 0.0.0.0 --port 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://casebot:${POSTGRES_PASSWORD}@db:5432/casebot

volumes:
  pgdata:
