# Replace "casebot" with your chosen app name (must be unique on fly.io)
app = "casebot"
primary_region = "iad"

[build]

[deploy]
  release_command = "python -c 'from db import database; database.init_db()'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "5s"
    type = "http"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
